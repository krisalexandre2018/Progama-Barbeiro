name: barbershop_app
description: App de agendamento para barbearia Ricardo Sidney
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (versões atualizadas)
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0

  # State Management
  provider: ^6.1.1

  # UI/UX
  flutter_svg: ^2.0.9

  # Utilities
  intl: ^0.20.0
  url_launcher: ^6.3.0
  crypto: ^3.0.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
