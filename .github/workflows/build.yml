name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout do código
    - uses: actions/checkout@v4

    # Configuração do Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Criação do arquivo de credenciais do Firebase
    - name: Create firebase-credentials.json from secret
      run: |
        echo '${{ secrets.FIREBASE_CREDENTIALS }}' > firebase-credentials.json

    # Instala dependências do Buildozer
    - name: Install Buildozer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          openjdk-17-jdk \
          unzip \
          git \
          zip \
          libncurses5-dev \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libssl-dev \
          cmake \
          ninja-build
      

      # Configura o Android SDK
    - name: Setup Android SDK
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip -d $HOME/android-sdk
        mkdir -p $HOME/android-sdk/cmdline-tools/latest
        mv $HOME/android-sdk/cmdline-tools/bin $HOME/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
        mv $HOME/android-sdk/cmdline-tools/lib $HOME/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
        
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
        
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

    # Instala o Buildozer e dependências Python
    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    # Compila o APK
    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
        
        buildozer android debug

    # Faz upload do APK gerado
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: barbearia-app
        path: bin/*.apk
